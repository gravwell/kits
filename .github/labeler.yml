# Path-based signal for actions/labeler (see workflows/labeler.yml).
#
# This is a COARSE, secondary signal — it only distinguishes "touches an
# existing kit dir" (improvement) from "touches something outside every
# known kit dir" (new-kit). It does NOT distinguish findings/fix/docs from
# improvement — workflows/pr-title-lint.yml, which maps the validated PR
# title 1:1 to the exact label, is the authoritative one. Treat a mismatch
# between this label and the title-derived one as a sign the PR title or
# diff is wrong, not something to auto-resolve.
#
# MAINTENANCE: when a new-kit PR merges, its directory must be added to the
# list below by hand, or the *next* PR touching that same directory will
# mislabel as new-kit again. Purely manual — there's no automated reminder
# for this (there was one in an earlier design, tied to a workflow that's
# since been retired; nothing has replaced it).

improvement:
  - changed-files:
      - any-glob-to-any-file:
          - 'auditd/**'
          - 'auth0/**'
          - 'aws_cloudtrail/**'
          - 'aws_guardduty/**'
          - 'azure/**'
          - 'barracuda/**'
          - 'bitwarden/**'
          - 'cisco_asa/**'
          - 'cisco_ftd/**'
          - 'coredns/**'
          - 'corelight/**'
          - 'duo/**'
          - 'fortinet/**'
          - 'github/**'
          - 'gravwell/**'
          - 'grok/**'
          - 'ipfix/**'
          - 'ipmi/**'
          - 'juniper/**'
          - 'linux_syslog/**'
          - 'netflowv5/**'
          - 'o365/**'
          - 'okta/**'
          - 'paloalto/**'
          - 'pfSense/**'
          - 'pihole/**'
          - 'syslog/**'
          - 'sysmon/**'
          - 'thinkst-canary/**'
          - 'weather/**'
          - 'windows/**'
          - 'windows_resource/**'
          - 'zeek/**'

new-kit:
  - changed-files:
      - all-globs-to-all-files:
          - '!auditd/**'
          - '!auth0/**'
          - '!aws_cloudtrail/**'
          - '!aws_guardduty/**'
          - '!azure/**'
          - '!barracuda/**'
          - '!bitwarden/**'
          - '!cisco_asa/**'
          - '!cisco_ftd/**'
          - '!coredns/**'
          - '!corelight/**'
          - '!duo/**'
          - '!fortinet/**'
          - '!github/**'
          - '!gravwell/**'
          - '!grok/**'
          - '!ipfix/**'
          - '!ipmi/**'
          - '!juniper/**'
          - '!linux_syslog/**'
          - '!netflowv5/**'
          - '!o365/**'
          - '!okta/**'
          - '!paloalto/**'
          - '!pfSense/**'
          - '!pihole/**'
          - '!syslog/**'
          - '!sysmon/**'
          - '!thinkst-canary/**'
          - '!weather/**'
          - '!windows/**'
          - '!windows_resource/**'
          - '!zeek/**'
